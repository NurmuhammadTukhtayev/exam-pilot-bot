[project]
name = "exam-test-bot"
version = "1.0.0"
description = "Telegram bot + Mini App for exam practice, exams, leaderboards and live group battles"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]  # generated files

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, comprehension and async checks
select = ["F", "E", "W", "I", "B", "UP", "SIM", "C4", "ASYNC"]
ignore = [
    "SIM105",  # contextlib.suppress isn't clearer than try/except/pass here
]

[tool.ruff.lint.isort]
known-first-party = ["bot", "webapp", "import_docs"]
